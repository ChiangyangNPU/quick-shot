# 一次性工具：清理 v0.1.0 的 Release 与 tag（重新发布前的重置）。用完即删。
#
# 背景：重新发布 v0.1.0 需要先清空旧状态，否则 GitHub Releases 会被复用、
# 旧附件残留。工作流用 runner 自带的 GITHUB_TOKEN 完成删除（本地无 API 令牌）。
name: Reset release v0.1.0

on:
  push:
    paths:
      - '.github/workflows/reset-release.yml'

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: v0.1.0
    steps:
      - name: Show current state
        run: |
          echo "--- releases ---"
          gh release list --repo "$GITHUB_REPOSITORY" || true
          echo "--- tags ---"
          gh api "repos/$GITHUB_REPOSITORY/git/refs/tags" --jq '.[].ref' || true

      - name: Delete release and tag
        run: |
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag \
            && echo "已删除 Release $TAG（含 --cleanup-tag）" \
            || echo "Release $TAG 不存在，跳过"
          # 兜底：--cleanup-tag 未生效时（例如 Release 已不存在但 tag 还在）单独删 tag
          if gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" >/dev/null 2>&1; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG"
            echo "已删除 tag $TAG"
          fi

      - name: Show final state
        run: |
          echo "--- releases ---"
          gh release list --repo "$GITHUB_REPOSITORY" || true
          echo "--- tags ---"
          gh api "repos/$GITHUB_REPOSITORY/git/refs/tags" --jq '.[].ref' || true
          echo "(以上两处为空即表示已清理干净)"
