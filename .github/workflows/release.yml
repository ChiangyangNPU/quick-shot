name: Release

# push v* 标签时，调用现有 deploy 脚本产出正式发布包并挂到 GitHub Release
# 注意：标签版本需与 CMakeLists.txt 的 PROJECT_VERSION 一致（workflow 内有校验）
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Release (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MinGW
            os: windows-latest
          - name: macOS arm64
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches CMakeLists version
        shell: bash
        run: |
          VER=$(sed -nE 's/^project\([[:space:]]*QuickShot[[:space:]]+VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*\)/\1/p' CMakeLists.txt)
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VER" != "$TAG" ]; then
            echo "::error::Tag (${GITHUB_REF_NAME}) 与 CMakeLists.txt 版本 (${VER}) 不一致"
            exit 1
          fi
          echo "Release version: $VER"

      # 发布说明取自 tag 注释（`git tag -a` 的 -m 内容）——文案随 tag 走，无需维护
      # 额外文件，GitHub/Gitee 两端同一份；末尾附 Full Changelog 链接
      - name: Prepare release notes
        shell: bash
        run: |
          # actions/checkout 对 tag 事件按 sha 拉取，浅克隆下本地是轻量 tag，
          # `%(contents)` 会退化成提交信息；显式按 ref 拉取才拿得到带注释的 tag 对象
          git fetch --depth=1 --force origin \
            "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME" >/dev/null 2>&1 || true
          if ! git cat-file -t "refs/tags/$GITHUB_REF_NAME" 2>/dev/null | grep -q '^tag$'; then
            echo "::warning::标签 $GITHUB_REF_NAME 不是附注标签，发布说明将退化为提交信息"
          fi
          {
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME" || true
            echo ''
            echo "**Full Changelog**: ${{ github.server_url }}/${{ github.repository }}/commits/$GITHUB_REF_NAME"
          } > release-notes.md
          wc -l release-notes.md

      # ---------- Windows（调用 deploy/win/deploy.ps1，产出 zip） ----------
      # 直接用 aqt 装包（install-qt-action 在该 runner 上连续失败，原因见 ci.yml 同款步骤）
      - name: Install Qt via aqt (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $log = "$env:RUNNER_TEMP\aqt-install.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          python -m pip install --quiet aqtinstall 2>&1 | Tee-Object -FilePath $log -Append
          $fail = 0
          $qt = "$env:RUNNER_TEMP\Qt"
          aqt install-qt windows desktop 6.10.2 win64_mingw --modules qtmultimedia --archives qtbase qtsvg qttools qttranslations MinGW d3dcompiler_47 --outputdir $qt 2>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { $fail = $LASTEXITCODE }
          aqt install-tool windows desktop tools_mingw1310 --outputdir $qt 2>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { $fail = $LASTEXITCODE }
          aqt install-tool windows desktop tools_ninja --outputdir $qt 2>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { $fail = $LASTEXITCODE }
          "QT_ROOT_DIR=$qt\6.10.2\mingw_64" | Add-Content -Path $env:GITHUB_ENV
          "IQTA_TOOLS=$qt\Tools" | Add-Content -Path $env:GITHUB_ENV
          if ($fail -ne 0) {
            "### aqt install failed (exit $fail) — last 60 lines" | Add-Content $env:GITHUB_STEP_SUMMARY
            '```' | Add-Content $env:GITHUB_STEP_SUMMARY
            Get-Content $log -Tail 60 | Add-Content $env:GITHUB_STEP_SUMMARY
            '```' | Add-Content $env:GITHUB_STEP_SUMMARY
            exit $fail
          }

      - name: Add toolchain to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $mingw = Get-ChildItem "$env:IQTA_TOOLS" -Directory -Filter 'mingw*_64' |
            Select-Object -First 1
          if (-not $mingw) { throw "MinGW toolchain not found under $env:IQTA_TOOLS" }
          $mingwBin = Join-Path $mingw.FullName 'bin'
          Add-Content $env:GITHUB_PATH $mingwBin
          Write-Host "MinGW added to PATH: $mingwBin"
          $ninja = Get-ChildItem "$env:IQTA_TOOLS" -Directory -Filter 'Ninja*' |
            Select-Object -First 1
          if ($ninja) {
            Add-Content $env:GITHUB_PATH $ninja.FullName
            Write-Host "Ninja added to PATH: $($ninja.FullName)"
          }

      - name: Build & package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:QUICKSHOT_QT_PREFIX = $env:QT_ROOT_DIR
          $env:QUICKSHOT_QT_BIN = Join-Path $env:QT_ROOT_DIR 'bin'
          $mingw = Get-ChildItem "$env:IQTA_TOOLS" -Directory -Filter 'mingw*_64' |
            Select-Object -First 1
          if (-not $mingw) { throw "MinGW toolchain not found under $env:IQTA_TOOLS" }
          $env:QUICKSHOT_MINGW_BIN = Join-Path $mingw.FullName 'bin'
          if (Test-Path "$env:IQTA_TOOLS\Ninja") {
            $env:QUICKSHOT_NINJA_DIR = "$env:IQTA_TOOLS\Ninja"
          }
          & .\deploy\win\deploy.ps1 -r

      - name: Upload to Release (Windows)
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          files: deploy/win/QuickShot-Release-v*-Windows-x64.zip
          body_path: release-notes.md

      # ---------- macOS（调用 deploy/mac/deploy_mac.sh，产出 DMG） ----------
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install qt onnxruntime
          # Pillow 只服务 DMG 背景图的动态版本号（装不上时 deploy_mac.sh 自动回退
          # 静态背景图，不影响安装包）。runner 镜像的 python3 环境限制不一
          # （PEP 668 externally-managed / 缺 pip），故逐级回退；仍失败只告警
          if python3 -m pip install --quiet pillow \
          || python3 -m pip install --quiet --break-system-packages pillow; then
            python3 -c "import PIL, sys; print('Pillow', PIL.__version__, '| python:', sys.executable)"
          elif python3 -m venv "$RUNNER_TEMP/pyenv" \
            && "$RUNNER_TEMP/pyenv/bin/pip" install --quiet pillow; then
            echo "$RUNNER_TEMP/pyenv/bin" >> "$GITHUB_PATH"
            echo "Pillow installed via venv: $RUNNER_TEMP/pyenv"
          else
            echo "::warning::Pillow 安装失败（$(command -v python3)），DMG 背景将回退为静态图"
          fi

      - name: Build & package (macOS)
        if: runner.os == 'macOS'
        run: |
          export QUICKSHOT_QT_PREFIX="$(brew --prefix qt)"
          # 显式用 bash 调用：脚本在 git 索引里的可执行位曾缺失，直接 ./ 会
          # Permission denied（CI 上表现为步骤 1 秒即失败）
          bash ./deploy/mac/deploy_mac.sh -r

      - name: Upload to Release (macOS)
        if: runner.os == 'macOS'
        uses: softprops/action-gh-release@v2
        with:
          files: deploy/mac/QuickShot-Release-v*.dmg
          body_path: release-notes.md

  # ---------- Gitee 发布：把同一份 CI 产物同步到 Gitee Release ----------
  # 与本地快速通道共用 deploy/gitee/publish_gitee_release.sh，两条通路行为一致：
  # 复用/创建 Gitee Release（说明取 tag 注释）→ 传附件（失败重试）→ 按实际下载
  # 字节数逐项校验，可重复执行（同名同大小自动跳过）
  gitee:
    name: Publish to Gitee
    needs: release
    runs-on: ubuntu-latest
    # 跨境链路偶发很慢（同作者的 TMD 项目曾实测小时级，正常时约 1 分钟）；
    # 失败/超时不影响已发布的 GitHub Release，用本地脚本分钟级补发
    # （见 docs/release-publish.md）
    timeout-minutes: 355
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0      # Gitee Release 的说明取自 tag 注释，需要附注标签对象
          fetch-tags: true

      - name: Publish to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          # Actions 自动提供：供脚本读 GitHub Release（带上可规避匿名 API 限流）
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # 密钥缺失即失败，避免出现「CI 全绿但 Gitee 没产物」
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::error::仓库未配置 GITEE_TOKEN 密钥（Settings → Secrets and variables → Actions → New repository secret，值取 Gitee 私人令牌）；本地补发：GITEE_TOKEN=<令牌> bash deploy/gitee/publish_gitee_release.sh $TAG"
            exit 1
          fi
          bash deploy/gitee/publish_gitee_release.sh "$TAG"
