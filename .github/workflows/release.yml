name: Release

# push v* 标签时，调用现有 deploy 脚本产出正式发布包并挂到 GitHub Release
# 注意：标签版本需与 CMakeLists.txt 的 PROJECT_VERSION 一致（workflow 内有校验）
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Release (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MinGW
            os: windows-latest
          - name: macOS arm64
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches CMakeLists version
        shell: bash
        run: |
          VER=$(sed -nE 's/^project\([[:space:]]*QuickShot[[:space:]]+VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*\)/\1/p' CMakeLists.txt)
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VER" != "$TAG" ]; then
            echo "::error::Tag (${GITHUB_REF_NAME}) 与 CMakeLists.txt 版本 (${VER}) 不一致"
            exit 1
          fi
          echo "Release version: $VER"

      # ---------- Windows（调用 deploy/win/deploy.ps1，产出 zip） ----------
      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          arch: 'win64_mingw'
          tools: 'tools_mingw1310,tools_ninja'
          modules: 'qtmultimedia'
          archives: 'qtbase qtsvg qttools qttranslations MinGW d3dcompiler_47'
          py7zrversion: '==1.1.3'
          cache: true

      - name: Build & package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:QUICKSHOT_QT_PREFIX = $env:QT_ROOT_DIR
          $env:QUICKSHOT_QT_BIN = Join-Path $env:QT_ROOT_DIR 'bin'
          $mingw = Get-ChildItem "$env:IQTA_TOOLS" -Directory -Filter 'mingw*_64' |
            Select-Object -First 1
          if (-not $mingw) { throw "MinGW toolchain not found under $env:IQTA_TOOLS" }
          $env:QUICKSHOT_MINGW_BIN = Join-Path $mingw.FullName 'bin'
          if (Test-Path "$env:IQTA_TOOLS\Ninja") {
            $env:QUICKSHOT_NINJA_DIR = "$env:IQTA_TOOLS\Ninja"
          }
          & .\deploy\win\deploy.ps1 -r

      - name: Upload to Release (Windows)
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          files: deploy/win/QuickShot-Release-v*-Windows-x64.zip

      # ---------- macOS（调用 deploy/mac/deploy_mac.sh，产出 DMG） ----------
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install qt onnxruntime

      - name: Build & package (macOS)
        if: runner.os == 'macOS'
        run: |
          export QUICKSHOT_QT_PREFIX="$(brew --prefix qt)"
          ./deploy/mac/deploy_mac.sh -r

      - name: Upload to Release (macOS)
        if: runner.os == 'macOS'
        uses: softprops/action-gh-release@v2
        with:
          files: deploy/mac/QuickShot-Release-v*.dmg
