name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main]

# 同一分支的新推送自动取消尚未完成的旧运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MinGW
            os: windows-latest
          - name: macOS arm64
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- Windows（对齐 deploy/win/deploy.ps1：Qt 6.10.2 mingw + MinGW 13.1.0 + Ninja） ----------
      # 直接用 aqt 装包（绕开 install-qt-action 黑盒）；输出写入 Step Summary 便于无认证排障
      - name: Install Qt via aqt (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $log = "$env:RUNNER_TEMP\aqt-install.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          python -m pip install --quiet aqtinstall 2>&1 | Tee-Object -FilePath $log -Append
          $fail = 0
          $qt = "$env:RUNNER_TEMP\Qt"
          aqt install-qt windows desktop 6.10.2 win64_mingw --modules qtmultimedia --archives qtbase qtsvg qttools qttranslations MinGW d3dcompiler_47 --outputdir $qt 2>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { $fail = $LASTEXITCODE }
          aqt install-tool windows desktop tools_mingw1310 --outputdir $qt 2>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { $fail = $LASTEXITCODE }
          aqt install-tool windows desktop tools_ninja --outputdir $qt 2>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { $fail = $LASTEXITCODE }
          "QT_ROOT_DIR=$qt\6.10.2\mingw_64" | Add-Content -Path $env:GITHUB_ENV
          "IQTA_TOOLS=$qt\Tools" | Add-Content -Path $env:GITHUB_ENV
          if ($fail -ne 0) {
            "### aqt install failed (exit $fail) — last 60 lines" | Add-Content $env:GITHUB_STEP_SUMMARY
            '```' | Add-Content $env:GITHUB_STEP_SUMMARY
            Get-Content $log -Tail 60 | Add-Content $env:GITHUB_STEP_SUMMARY
            '```' | Add-Content $env:GITHUB_STEP_SUMMARY
            exit $fail
          }

      - name: Add toolchain to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $mingw = Get-ChildItem "$env:IQTA_TOOLS" -Directory -Filter 'mingw*_64' |
            Select-Object -First 1
          if (-not $mingw) { throw "MinGW toolchain not found under $env:IQTA_TOOLS" }
          $mingwBin = Join-Path $mingw.FullName 'bin'
          Add-Content $env:GITHUB_PATH $mingwBin
          Write-Host "MinGW added to PATH: $mingwBin"
          $ninja = Get-ChildItem "$env:IQTA_TOOLS" -Directory -Filter 'Ninja*' |
            Select-Object -First 1
          if ($ninja) {
            Add-Content $env:GITHUB_PATH $ninja.FullName
            Write-Host "Ninja added to PATH: $($ninja.FullName)"
          }

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP\configure.log"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            "### Configure failed (exit $LASTEXITCODE) — last 60 lines" | Add-Content $env:GITHUB_STEP_SUMMARY
            '```' | Add-Content $env:GITHUB_STEP_SUMMARY
            Get-Content $log -Tail 60 | Add-Content $env:GITHUB_STEP_SUMMARY
            '```' | Add-Content $env:GITHUB_STEP_SUMMARY
            exit $LASTEXITCODE
          }

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP\build.log"
          cmake --build build --parallel 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            "### Build failed (exit $LASTEXITCODE) — last 80 lines" | Add-Content $env:GITHUB_STEP_SUMMARY
            '```' | Add-Content $env:GITHUB_STEP_SUMMARY
            Get-Content $log -Tail 80 | Add-Content $env:GITHUB_STEP_SUMMARY
            '```' | Add-Content $env:GITHUB_STEP_SUMMARY
            exit $LASTEXITCODE
          }

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: QuickShot-Windows-x64
          path: build/QuickShot.exe
          if-no-files-found: error

      # ---------- macOS（对齐 deploy/mac/deploy_mac.sh：Homebrew Qt + onnxruntime，/opt/homebrew） ----------
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install qt onnxruntime
          echo "QT_PREFIX=$(brew --prefix qt)" >> "$GITHUB_ENV"

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX"

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: cmake --build build --parallel

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: QuickShot-macOS-arm64
          path: build/QuickShot
          if-no-files-found: error
